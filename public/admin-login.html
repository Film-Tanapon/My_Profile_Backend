<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f4ed;color:#26273e;font-family:system-ui,sans-serif}main{background:#fffefa;padding:32px;border:1px solid #deddd4;border-radius:12px;width:min(360px,calc(100vw - 96px))}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:12px;font:inherit}button{background:#26273e;color:white;border:0;border-radius:6px;cursor:pointer}#error{color:#b42318}label{display:block}</style><main><h1>เข้าสู่ระบบ Admin</h1><p>กรอกรหัสเพื่อจัดการข้อมูล Portfolio</p><form><label for="password">รหัสผ่าน</label><input id="password" type="password" required autocomplete="current-password"><button>เข้าสู่ระบบ</button><p id="error" role="alert"></p></form></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('button');button.disabled=true;try{const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('input').value})});const data=await r.json();if(!r.ok)throw Error(data.message);location.replace('/admin/');}catch(e){document.querySelector('#error').textContent=e.message;}finally{button.disabled=false;}};</script></html>
